# -----------------------------------------------------------------------------
# Overrides para el despliegue en EKS.
# Se aplica ENCIMA de app-config.yaml y app-config.production.yaml (ultimo --config
# gana). Se inyecta en el pod como ConfigMap montado + un --config extra en los
# args del Deployment (ver k8s/deployment.yaml y k8s/configmap-app-config.yaml).
#
# El dominio NO se hardcodea: se toma de la variable de entorno
# ${BACKSTAGE_BASE_URL} (Backstage interpola ${VAR} nativamente al arrancar).
# La define el ConfigMap backstage-config (k8s/configmap-app-config.yaml). Asi la
# MISMA imagen sirve para cualquier dominio/ambiente: solo cambia la variable.
# Mientras el dominio/exposicion este POR DEFINIR, el ConfigMap trae un
# placeholder; actualizarlo cuando exista el dominio real.
# -----------------------------------------------------------------------------
app:
  baseUrl: ${BACKSTAGE_BASE_URL}

backend:
  baseUrl: ${BACKSTAGE_BASE_URL}
  listen: ':7007'
  cors:
    origin: ${BACKSTAGE_BASE_URL}
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true

  # Sigue usando SQLite sobre el volumen persistente (/app/data).
  # Cuando migres a Postgres, reemplaza este bloque por client: pg.
  database:
    client: better-sqlite3
    connection:
      directory: /app/data

techdocs:
  builder: local
  generator:
    runIn: local
  publisher:
    type: local
