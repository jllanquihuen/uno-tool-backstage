apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backstage
  namespace: backstage
  annotations:
    # Requiere el AWS Load Balancer Controller instalado en el cluster.
    # Verifica con: kubectl get deployment -n kube-system aws-load-balancer-controller
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /.backstage/health/v1/readiness
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    # Para HTTPS: descomenta y pon el ARN de tu certificado ACM.
    # alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:<region>:<account>:certificate/<id>
    # alb.ingress.kubernetes.io/ssl-redirect: '443'
spec:
  rules:
    # REEMPLAZAR por tu dominio real (debe coincidir con app.baseUrl / backend.baseUrl).
    - host: backstage.tu-dominio.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backstage
                port:
                  number: 80
