# -----------------------------------------------------------------------------
# EJEMPLO de Secret. NO subas este archivo con valores reales a git.
#
# Opcion recomendada: crear el Secret desde la CLI en vez de un YAML con
# valores en claro, asi los tokens no quedan en el repo:
#
#   kubectl create secret generic backstage-secrets \
#     --namespace backstage \
#     --from-literal=GITHUB_TOKEN=ghp_xxx \
#     --from-literal=AUTH_GITHUB_CLIENT_ID=xxx \
#     --from-literal=AUTH_GITHUB_CLIENT_SECRET=xxx
#
# Si prefieres aplicarlo por YAML, rellena los valores abajo (stringData admite
# texto plano; Kubernetes lo codifica solo) y aplica con kubectl apply -f.
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: backstage-secrets
  namespace: backstage
type: Opaque
stringData:
  GITHUB_TOKEN: "REEMPLAZAR"
  AUTH_GITHUB_CLIENT_ID: "REEMPLAZAR"
  AUTH_GITHUB_CLIENT_SECRET: "REEMPLAZAR"
